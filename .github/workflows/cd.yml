name: CD

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - master
    types:
      - completed

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.workflow_run.head_sha }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install dependencies
      run: pip install -e . --group build

    - name: Build package
      run: make build

    - name: Check build
      run: make check-build

    - name: Record deployment identity
      env:
        DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
      run: make release-metadata

    - name: Upload package build
      uses: actions/upload-artifact@v7
      with:
        name: dist-${{ github.event.workflow_run.head_sha }}
        path: dist/
        if-no-files-found: error
        # A rerun of a partly uploaded run replaces its artifacts instead of conflicting.
        overwrite: true

    - name: Upload deployment identity
      uses: actions/upload-artifact@v7
      with:
        name: release-metadata-${{ github.event.workflow_run.head_sha }}
        path: release-metadata.json
        if-no-files-found: error
        overwrite: true
