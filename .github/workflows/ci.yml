name: CI

on:
  push:
    branches:
        - master
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "pyproject.toml"
      - "Makefile"
      - "scripts/validate_notebooks.sh"
      - "scripts/ci/run_check.sh"
      - ".github/workflows/ci.yml"
  pull_request:
    branches:
        - master
    paths:
      - "src/**"
      - "tests/**"
      - "notebooks/**"
      - "pyproject.toml"
      - "Makefile"
      - "scripts/validate_notebooks.sh"
      - "scripts/ci/run_check.sh"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, format-check, type-check, test, notebooks-check, validate-version]

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'
        cache-dependency-path: 'pyproject.toml'

    - name: Install dependencies
      run: pip install -e .[all] --group dev

    - name: Run ${{ matrix.check }}
      if: matrix.check != 'validate-version' || github.event_name == 'pull_request'
      run: |
        case "${{ matrix.check }}" in
          lint|format-check|type-check|test|notebooks-check|validate-version)
            ./scripts/ci/run_check.sh "${{ matrix.check }}"
            ;;
          *)
            echo "Unknown check type: ${{ matrix.check }}"
            exit 1
            ;;
        esac
