name: Release

on:
  workflow_run:
    workflows: ["CD"]
    branches:
      - master
    types:
      - completed

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'master' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    env:
      RELEASE_METADATA: ${{ runner.temp }}/release-metadata/release-metadata.json
    steps:
    - name: Check out repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Download deployment identity
      uses: actions/download-artifact@v8
      with:
        name: release-metadata
        path: ${{ runner.temp }}/release-metadata
        run-id: ${{ github.event.workflow_run.id }}
        repository: ${{ github.repository }}
        github-token: ${{ secrets.GITHUB_TOKEN }}

    - name: Select deployed commit
      id: deployment
      run: make release-select-commit

    - name: Check out deployed commit
      uses: actions/checkout@v7
      with:
        ref: ${{ steps.deployment.outputs.sha }}
        path: deployed
        persist-credentials: false

    - name: Publish GitHub release
      run: make release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RELEASE_PROJECT: deployed
