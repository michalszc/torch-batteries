name: Mark and close stale issues and pull requests

on:
  schedule:
    - cron: '45 10 * * 1'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Mark and close inactive issues and pull requests
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 90
          days-before-close: 30
          operations-per-run: 5
          exempt-draft-pr: 'false'
          remove-stale-when-updated: 'true'
          delete-branch: 'false'
          enable-statistics: 'true'
          stale-issue-label: 'no-activity'
          stale-pr-label: 'no-activity'
          stale-issue-message: >-
            This issue has had no activity for 90 days and has been marked as stale.
            It will be closed if there is no further activity for 30 days.
            Please comment with updates or explain why it should remain open.
            Thank you for contributing!
          stale-pr-message: >-
            This pull request has had no activity for 90 days and has been marked as stale.
            This policy also applies to draft pull requests.
            It will be closed if there is no further activity for 30 days.
            Please comment with a progress update or update the pull request to keep it active.
            Thank you for your contribution!
          close-issue-message: >-
            This issue was automatically closed after remaining stale for at least 30 days
            without further activity. If it still needs attention, please reopen it or
            create a new issue with updated details.
          close-pr-message: >-
            This pull request was automatically closed after remaining stale for at least
            30 days without further activity. If you would like to continue the work,
            please reopen it or submit a new pull request. Thank you for your contribution!
